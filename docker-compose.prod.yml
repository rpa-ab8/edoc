# Production stack — one server, everything in Docker (Tech Stack §3.9). See deploy/README.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only `web` (Caddy) is reachable from outside: Postgres and Redis publish no ports.

# Distinct from the dev compose project ("dms"), so running both on one machine can't collide.
name: dms-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: dms-backend:${IMAGE_TAG:-latest}
  env_file: ${ENV_FILE:-.env.production}
  environment:
    NODE_ENV: production
    TRUST_PROXY: "true"
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    # Image OCR (Tesseract) stays OFF in production: it needs the larger 4 vCPU / 8 GB server, which
    # the approved budget doesn't include. PDF text extraction (the `worker` service) is unaffected.
    # Only "true" turns it on — and only together with a server resize.
    OCR_IMAGES_ENABLED: ${OCR_IMAGES_ENABLED:-false}
  logging: *logging
  # NAS storage only: mount the share at the same path the storage config uses, in api AND worker,
  # and set STORAGE_NAS_ROOT=/mnt/dms-nas in .env.production (NAS is refused without it).
  # volumes:
  #   - /mnt/dms-nas:/mnt/dms-nas

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: dms-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    restart: unless-stopped
    command: ["node", "dist/worker/ocr.worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Daily retention run (auto-delete into trash, then the automatic trash purge), at
  # RETENTION_JOB_TIME / RETENTION_JOB_TIME_ZONE from .env.production. Its own process so a slow
  # purge never competes with OCR, and so it can be stopped on its own.
  retention-worker:
    <<: *backend
    restart: unless-stopped
    command: ["node", "dist/worker/retention.worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Disaster-recovery guard: daily writes an off-DB manifest (storage ref → file/document/folder) into
  # ./backups (backup.sh encrypts and ships it off-site) and re-hashes a sample of stored files against
  # the database checksums. Set DATA_GUARD_HEALTHCHECK_URL for a dead-man's-switch alert.
  data-guard:
    <<: *backend
    restart: unless-stopped
    command: ["node", "dist/worker/data-guard.js"]
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OCR_IMAGES_ENABLED: ${OCR_IMAGES_ENABLED:-false}
      DATA_GUARD_DIR: /backups
      DATA_GUARD_HEALTHCHECK_URL: ${DATA_GUARD_HEALTHCHECK_URL:-}
    # This list replaces x-backend's volumes, so with NAS storage also add the NAS mount here
    # (e.g. - /mnt/dms-nas:/mnt/dms-nas), or the scrub can't read the files.
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies pending Prisma migrations, then exits. api/worker wait for it to succeed.
  migrate:
    <<: *backend
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  backup:
    build: deploy/backup
    image: dms-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-dms}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      # Off-site copy is mandatory in production: a run with no BACKUP_S3_BUCKET fails and alerts.
      BACKUP_REQUIRE_OFFSITE: ${BACKUP_REQUIRE_OFFSITE:-true}
      # age public key (age1…) — encrypts dumps before they leave the server. Keep the private key offline.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # Dead-man's-switch (Healthchecks.io / Uptime Kuma push URL): pinged on success, /fail on failure.
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the newer default checksum headers from recent AWS SDKs/CLIs (the same issue
      # the R2 storage driver hit) — only send checksums when an operation requires them.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Optional: `--profile monitoring`. Bound to localhost only — reach it over an SSH tunnel
  # (ssh -L 3001:127.0.0.1:3001 user@server), never expose it publicly.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
